name: Binance Supertrend Signal Scanner

on:
  schedule:
    - cron: '1 * * * *'  # Har ghante ki 1st minute par chalega (candle close hone ke baad)
  workflow_dispatch:     # Manually chalane ka button bhi dega

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pandas-ta

      - name: Run Signal Scanner
        env:
          WHATSAPP_API_URL: ${{ secrets.WHATSAPP_API_URL }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_RECIPIENT_PHONE: ${{ secrets.WHATSAPP_RECIPIENT_PHONE }}
        run: |
          python scanner.py
